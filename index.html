    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}

        // Suppress unhandled errors originating from external browser extensions
        window.addEventListener('error', function(e) {
          if (
            (e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) ||
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1)
          ) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
